<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Copa Memória</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            ⚽
            <span>COPA MEMÓRIA</span>
        </div>
    </header>

    <main>

        <section class="game-container">

            <div class="titulo">
                <div class="bola">⚽</div>

                <h1>JOGO DA MEMÓRIA</h1>

                <p>Encontre os pares das seleções!</p>
            </div>

            <div class="informacoes">

                <div class="info-box">
                    <span>MOVIMENTOS</span>
                    <strong id="movimentos">0</strong>
                </div>

                <div class="info-box">
                    <span>PARES</span>
                    <strong>
                        <span id="pares">0</span> / 10
                    </strong>
                </div>

            </div>

            <div id="tabuleiro" class="tabuleiro"></div>

            <button id="novoJogo" class="botao">
                🔄 Novo jogo
            </button>

        </section>

    </main>

    <!-- Modal da pergunta -->
    <div id="modalPergunta" class="modal">

        <div class="modal-content">

            <button id="fecharModal" class="fechar">
                ×
            </button>

            <div id="perguntaConteudo"></div>

        </div>

    </div>

    <!-- Tela final -->
    <div id="modalFinal" class="modal">

        <div class="modal-content final">

            <div class="trofeu">
                🏆
            </div>

            <h2>Parabéns!</h2>

            <p>Você encontrou todos os pares!</p>

            <p>
                Movimentos:
                <strong id="movimentosFinal">0</strong>
            </p>

            <button id="jogarNovamente" class="botao">
                Jogar novamente
            </button>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
